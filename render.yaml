services:
  - type: web
    name: opencall-monitor
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && playwright install --with-deps chromium"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DEVELOPMENT_AID_EMAIL
        sync: false
      - key: DEVELOPMENT_AID_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.10
